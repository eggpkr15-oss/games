<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 미니게임 아케이드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 40px; }
        h1 { margin-bottom: 30px; }
        .game-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .game-card { background: #2a2a2a; border-radius: 10px; padding: 20px; width: 250px; text-decoration: none; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-5px); background: #333; }
        .game-card h3 { margin-top: 0; color: #ffcc00; }
    </style>
</head>
<body>
    <h1>🎮 나의 미니게임 아케이드</h1>
    <div class="game-grid">
        <!-- 첫 번째 게임 링크 -->
        <a href="./game1/index.html" class="game-card">
            <h3>맞춤법 붕어빵</h3>
            <p>퀴즈를 풀고 붕어빵을 구워보세요!</p>
        </a>
        <!-- 두 번째 게임 링크 (추가 가능) -->
        <a href="./game2/index.html" class="game-card">
            <h3>두 번째 게임</h3>
            <p>게임 설명이 들어갑니다.</p>
        </a>
    </div>
</body>
</html>
